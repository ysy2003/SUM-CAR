base_model: meta-llama/Meta-Llama-3-8B-Instruct

mem:
  num_slots: 4096
  k_top: 64
  alpha: 1.0
  tau: 10.0
  use_gate: false
  normalize_retrieval: false
  track_hits: false
  hits_source: "none"
  memory_position: middle  # 'embedding' or 'middle'

train:
  epochs: 1
  lr: 5.0e-5
  lr_kv: 1.0e-4
  lr_gate: 1.0e-5
  batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 512 
  probe_steps: 0
  top_t: 4096
  refresh_every: 100
  save_dir: noLoRA/finqa
  patch_output_dir: noLoRA
  checkpoint_base_dir: noLoRA
  seed: 42

  # 关键改动：
  dataset: finqa_rc       # 对应你给的 finqa_rc loader
  max_examples: null      # 用 CLI 的 --max_examples 覆盖的话照旧
  use_cot: true           # 让 loader 用 CoT prompt（会走 _COT_INST）
  use_lora: false         # 只训 memory layer
  use_fp16: False         # 和 math 一致，FP32 更稳
