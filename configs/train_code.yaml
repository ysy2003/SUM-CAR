base_model: meta-llama/Meta-Llama-3-8B-Instruct
mem:
  num_slots: 4096
  k_top: 8
  alpha: 1.0
  tau: 10.0
  use_gate: false
  normalize_retrieval: true
  track_hits: false
  hits_source: "none"
train:
  epochs: 3
  lr: 5.0e-4
  lr_kv: 1.0e-3
  lr_gate: 1.0e-4
  batch_size: 8
  max_length: 128 
  probe_steps: 200
  top_t: 512
  refresh_every: 100
  save_dir: out_fp16/code
  patch_output_dir: out_fp16
  checkpoint_base_dir: out_fp16
  seed: 42
  dataset: codexglue_refine
  max_examples: null 
  use_lora: False
  use_fp16: False
